name: test
on: push

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
    - name: test
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch origin main
        tap_dir="$(brew --repository masawada/tap)"
        mkdir -p "$(dirname "$tap_dir")"
        ln -s "$PWD" "$tap_dir"
        git diff origin/main --name-only -- 'Formula/*.rb' \
        | while read -r formula; do
            brew install --build-from-source "masawada/tap/$(basename "$formula" .rb)"
          done
